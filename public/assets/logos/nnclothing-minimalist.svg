<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Define Gradients -->
  <defs>
    <linearGradient id="minGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="minDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <filter id="minShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="50" cy="50" r="48" fill="url(#minDark)" filter="url(#minShadow)"/>
  <circle cx="50" cy="50" r="48" fill="none" stroke="url(#minGradient)" stroke-width="1.5" opacity="0.5"/>

  <!-- Minimalist NN Design -->
  <g transform="translate(50, 50)">
    <!-- First N -->
    <g transform="translate(-16, -12)">
      <line x1="4" y1="4" x2="4" y2="20" stroke="url(#minGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 4 20 L 14 4" stroke="url(#minGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <line x1="14" y1="4" x2="14" y2="20" stroke="url(#minGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Second N -->
    <g transform="translate(6, -12)">
      <line x1="4" y1="4" x2="4" y2="20" stroke="url(#minGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 4 20 L 14 4" stroke="url(#minGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <line x1="14" y1="4" x2="14" y2="20" stroke="url(#minGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Accent Dot -->
    <circle cx="-6" cy="12" r="1.5" fill="url(#minGradient)"/>
    <circle cx="12" cy="12" r="1.5" fill="url(#minGradient)"/>
  </g>
</svg>
