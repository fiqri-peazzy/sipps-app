<svg viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Define Gradients -->
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="60" cy="60" r="55" fill="url(#primaryGradient)" filter="url(#shadow)"/>

  <!-- Outer Ring -->
  <circle cx="60" cy="60" r="55" fill="none" stroke="url(#accentGradient)" stroke-width="2" opacity="0.3"/>

  <!-- "N" Design - Left -->
  <g transform="translate(30, 30)">
    <!-- Vertical line left -->
    <line x1="8" y1="8" x2="8" y2="32" stroke="url(#accentGradient)" stroke-width="3" stroke-linecap="round"/>
    <!-- Diagonal -->
    <line x1="8" y1="32" x2="22" y2="8" stroke="url(#accentGradient)" stroke-width="3" stroke-linecap="round"/>
    <!-- Vertical line right -->
    <line x1="22" y1="8" x2="22" y2="32" stroke="url(#accentGradient)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- "N" Design - Right (mirrored) -->
  <g transform="translate(60, 30)">
    <!-- Vertical line left -->
    <line x1="8" y1="8" x2="8" y2="32" stroke="url(#accentGradient)" stroke-width="3" stroke-linecap="round"/>
    <!-- Diagonal -->
    <line x1="8" y1="32" x2="22" y2="8" stroke="url(#accentGradient)" stroke-width="3" stroke-linecap="round"/>
    <!-- Vertical line right -->
    <line x1="22" y1="8" x2="22" y2="32" stroke="url(#accentGradient)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Decorative Elements -->
  <circle cx="42" cy="85" r="3" fill="url(#accentGradient)"/>
  <circle cx="78" cy="85" r="3" fill="url(#accentGradient)"/>

  <!-- Brand Text -->
  <text x="140" y="45" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="36" font-weight="700" fill="#1f2937" letter-spacing="-0.5">
    NNCLOTHING
  </text>

  <!-- Tagline -->
  <text x="140" y="70" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="12" font-weight="400" fill="#6b7280" letter-spacing="1">
    PREMIUM CUSTOM APPAREL
  </text>

  <!-- Accent Line -->
  <line x1="140" y1="80" x2="220" y2="80" stroke="url(#accentGradient)" stroke-width="2"/>
</svg>
