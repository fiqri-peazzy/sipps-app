<svg viewBox="0 0 300 80" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Define Gradients -->
  <defs>
    <linearGradient id="hGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hDarkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon Container -->
  <circle cx="40" cy="40" r="35" fill="url(#hDarkGradient)"/>
  <circle cx="40" cy="40" r="35" fill="none" stroke="url(#hGradient)" stroke-width="1.5" opacity="0.5"/>

  <!-- NN Icon inside circle -->
  <g>
    <!-- First N -->
    <g transform="translate(16, 20)">
      <line x1="6" y1="6" x2="6" y2="28" stroke="url(#hGradient)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 6 28 L 18 6" stroke="url(#hGradient)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <line x1="18" y1="6" x2="18" y2="28" stroke="url(#hGradient)" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Second N -->
    <g transform="translate(32, 20)">
      <line x1="6" y1="6" x2="6" y2="28" stroke="url(#hGradient)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 6 28 L 18 6" stroke="url(#hGradient)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <line x1="18" y1="6" x2="18" y2="28" stroke="url(#hGradient)" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Decorative dot -->
    <circle cx="25" cy="56" r="1.5" fill="url(#hGradient)"/>
  </g>

  <!-- Brand Text -->
  <text x="90" y="35" font-family="'Inter', 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#1f2937" letter-spacing="-0.5">
    NNCLOTHING
  </text>

  <!-- Accent Line below text -->
  <line x1="90" y1="45" x2="180" y2="45" stroke="url(#hGradient)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Subtext -->
  <text x="90" y="65" font-family="'Inter', 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#6b7280" letter-spacing="0.5">
    CUSTOM APPAREL CRAFTED
  </text>
</svg>
